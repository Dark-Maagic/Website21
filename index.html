<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare Pages Function Test</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }
    pre {
      font-family: monospace;
      margin-top: 20px;
      font-size: 16px;
      display: inline-block;
      text-align: left;
      background-color: #f4f4f4;
      padding: 15px;
      border-radius: 5px;
      max-width: 600px;
      white-space: pre-wrap;
    }
    #image-wrapper {
      margin-top: 25px;
      display: none;
    }
    #cat-image {
      max-width: 500px;
      width: 90%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <h1>Welcome to My Website!</h1>
  <p>Deploys automatically via Cloudflare Pages!!</p>

  <h2>Cloudflare Pages Functions Demo</h2>
  <div>
    <button id="fetch-cat-btn">Get ASCII Cat</button>
    <button id="fetch-gemini-btn">Get Cat in Nature Photo</button>
  </div>

  <br>
  <pre id="output-box">Click a button to load data...</pre>

  <!-- Single container for the rotating cat photo -->
  <div id="image-wrapper">
    <img id="cat-image" src="" alt="Cat in Nature" />
  </div>

  <script>
    const output = document.getElementById('output-box');
    const imageWrapper = document.getElementById('image-wrapper');
    const catImage = document.getElementById('cat-image');

    // 1. ASCII Cat button handler
    document.getElementById('fetch-cat-btn').addEventListener('click', async () => {
      imageWrapper.style.display = 'none';
      output.textContent = 'Loading ASCII cat...';
      try {
        const response = await fetch('/api/cat');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const asciiCat = await response.text();
        output.textContent = asciiCat;
      } catch (error) {
        output.textContent = 'Error fetching cat: ' + error.message;
        console.error(error);
      }
    });

    // 2. Random Cat Photo button handler
    document.getElementById('fetch-gemini-btn').addEventListener('click', async () => {
      output.textContent = 'Selecting a random cat photo...';

      try {
        const response = await fetch('/api/gemini');
        const data = await response.json();

        if (!response.ok || data.error) {
          output.textContent = 'API Error:\n' + JSON.stringify(data, null, 2);
          return;
        }

        output.textContent = 'New cat photo loaded!';
        catImage.src = data.sourceImageUrl;
        imageWrapper.style.display = 'block';
      } catch (error) {
        output.textContent = 'Network/Fetch Error: ' + error.message;
        console.error(error);
      }
    });
  </script>

</body>
</html>
